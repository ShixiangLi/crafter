# 所有智能体共用的模型/API、推理参数与评测设置。
# 切换服务只修改这里的 api；同目录其他 YAML 仅配置算法。
api:
  base_url: https://api.siliconflow.cn/v1
  model: deepseek-ai/DeepSeek-V4-Flash
  api_key_env: SILICONFLOW_API_KEY
balrog_path: BALROG
output_dir: outputs/results
num_episodes: 10
num_workers: 1
max_steps: 2000
history_length: 16
replan_interval: 10
temperature: 1.0
num_predict: 8192
